<!doctype html>
<html lang="es" class="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Centris — Boceto Base: Sidebar + Dashboard /inicio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --canvas: #09090b;
      --surface: #111214;
      --elevated: #18191c;
      --border: #232428;
      --white: #ffffff;
      --gray: #a1a1aa;
      --lime: #c1f429;
      --lime-hover: #aedf1b;
      --black: #000000;
      --mint: #18ffc8;
      --mint-bg: rgba(24, 255, 200, 0.14);
      --mint-border: rgba(24, 255, 200, 0.28);
      --coral: #ff6d6d;
      --coral-bg: rgba(255, 109, 109, 0.14);
      --coral-border: rgba(255, 109, 109, 0.28);
      --amber: #fbbf24;
      --amber-bg: rgba(251, 191, 36, 0.14);
      --amber-border: rgba(251, 191, 36, 0.28);
      --font: "Inter", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    ::selection { background: var(--lime); color: var(--black); }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--canvas);
      color: var(--white);
      font-family: var(--font);
      font-size: 0.9375rem;
      font-weight: 400;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .tabular-nums { font-variant-numeric: tabular-nums; }
    .hidden { display: none !important; }

    /* Barra superior exclusiva del boceto para probar roles */
    .preview-toolbar {
      background: #050506;
      border-bottom: 1px dashed var(--border);
      padding: 8px 16px;
      font-size: 0.8125rem;
      color: var(--gray);
    }
    .preview-toolbar-inner {
      max-width: 1440px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .preview-pills {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }
    .preview-pill {
      min-height: 36px;
      padding: 6px 14px;
      border-radius: 9999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--white);
      font-family: var(--font);
      font-size: 0.8125rem;
      font-weight: 500;
      cursor: pointer;
    }
    .preview-pill[aria-pressed="true"] {
      background: rgba(193, 244, 41, 0.12);
      border-color: var(--lime);
      color: var(--lime);
    }

    /* Shell principal: Sidebar vertical izquierdo + Contenido */
    .app-shell {
      max-width: 1440px;
      margin: 0 auto;
      min-height: calc(100vh - 53px);
      display: grid;
      grid-template-columns: 1fr;
    }
    @media (min-width: 1024px) {
      .app-shell {
        grid-template-columns: 248px minmax(0, 1fr);
      }
    }

    /* Sidebar izquierdo con ícono + nombre visible */
    .sidebar {
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 20px 14px;
      display: none;
      flex-direction: column;
      justify-content: space-between;
      gap: 20px;
    }
    @media (min-width: 1024px) {
      .sidebar {
        display: flex;
        position: sticky;
        top: 0;
        height: 100vh;
      }
    }
    .sidebar.mobile-open {
      display: flex;
      position: fixed;
      inset: 0 auto 0 0;
      width: 272px;
      z-index: 60;
      height: 100vh;
      box-shadow: 16px 0 48px rgba(0, 0, 0, 0.7);
    }
    .sidebar-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      z-index: 50;
    }

    .brand-lockup {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 10px 14px;
      border-bottom: 1px solid var(--border);
    }
    .brand-mark {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      font-size: 1.0625rem;
      letter-spacing: -0.02em;
      color: var(--white);
    }
    .brand-badge-dot {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      background: var(--lime);
      color: var(--black);
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 1rem;
    }

    .side-nav {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 14px;
    }
    .side-link {
      min-height: 44px;
      padding: 10px 14px;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--gray);
      font-size: 0.9375rem;
      font-weight: 500;
      transition: background-color 150ms ease, color 150ms ease;
    }
    .side-link svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }
    .side-link:hover {
      background: var(--elevated);
      color: var(--white);
    }
    .side-link[aria-current="page"] {
      background: var(--lime);
      color: var(--black);
      font-weight: 600;
    }

    .sidebar-footer {
      border-top: 1px solid var(--border);
      padding-top: 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* Columna derecha: Topbar contextual + Bento Canvas */
    .workspace-col {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .topbar {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    @media (min-width: 1024px) {
      .topbar { padding: 16px 28px; }
    }

    .topbar-left, .topbar-right {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .mobile-menu-btn {
      width: 44px;
      height: 44px;
      border-radius: 9999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--white);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    @media (min-width: 1024px) {
      .mobile-menu-btn { display: none; }
    }

    /* Cápsulas de contexto en topbar (estilo mockup) */
    .capsule {
      min-height: 44px;
      padding: 6px 14px;
      border-radius: 9999px;
      border: 1px solid var(--border);
      background: var(--surface);
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 0.875rem;
      color: var(--white);
    }
    .capsule-muted { color: var(--gray); }
    .capsule-dot {
      width: 8px;
      height: 8px;
      border-radius: 9999px;
      background: var(--lime);
      flex-shrink: 0;
    }
    .capsule-select {
      background: transparent;
      border: 0;
      color: var(--white);
      font-family: var(--font);
      font-size: 0.9375rem;
      font-weight: 500;
      cursor: pointer;
      outline: none;
    }
    .capsule-select option { background: var(--surface); color: var(--white); }

    .avatar-circle {
      width: 30px;
      height: 30px;
      border-radius: 9999px;
      background: var(--elevated);
      border: 1px solid var(--border);
      display: grid;
      place-items: center;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--lime);
    }

    .icon-btn-circle {
      position: relative;
      width: 44px;
      height: 44px;
      border-radius: 9999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--white);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      cursor: pointer;
      transition: background-color 150ms ease, border-color 150ms ease;
    }
    .icon-btn-circle:hover {
      background: var(--elevated);
      border-color: #3a3c42;
    }
    .coral-counter {
      position: absolute;
      top: -4px;
      right: -4px;
      min-width: 20px;
      height: 20px;
      padding: 0 5px;
      border-radius: 9999px;
      background: var(--coral);
      color: var(--black);
      font-size: 0.6875rem;
      font-weight: 700;
      display: grid;
      place-items: center;
    }

    /* Botones */
    .btn {
      min-height: 44px;
      padding: 10px 18px;
      border-radius: 9999px;
      border: 1px solid transparent;
      font-family: var(--font);
      font-size: 0.9375rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      transition: background-color 150ms ease;
    }
    .btn-primary { background: var(--lime); color: var(--black); }
    .btn-primary:hover { background: var(--lime-hover); }
    .btn-secondary { background: var(--elevated); color: var(--white); border-color: var(--border); }
    .btn-secondary:hover { background: #222328; }

    /* Focus rings accesibles */
    .side-link:focus-visible, .btn:focus-visible, .icon-btn-circle:focus-visible, .preview-pill:focus-visible, .mobile-menu-btn:focus-visible {
      outline: none;
      box-shadow: 0 0 0 2px var(--lime);
    }

    /* Badges semánticos */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 9999px;
      border: 1px solid transparent;
      padding: 4px 10px;
      font-size: 0.75rem;
      font-weight: 500;
      line-height: 1.25;
      white-space: nowrap;
    }
    .badge svg { width: 13px; height: 13px; flex-shrink: 0; }
    .badge-mint { background: var(--mint-bg); color: var(--mint); border-color: var(--mint-border); }
    .badge-coral { background: var(--coral-bg); color: var(--coral); border-color: var(--coral-border); }
    .badge-amber { background: var(--amber-bg); color: var(--amber); border-color: var(--amber-border); }
    .badge-zinc { background: rgba(161, 161, 170, 0.14); color: var(--gray); border-color: rgba(161, 161, 170, 0.28); }

    /* Área principal Bento */
    .main-area {
      padding: 24px 20px 48px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    @media (min-width: 1024px) {
      .main-area { padding: 24px 28px 56px; }
    }

    .page-header {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: space-between;
      gap: 14px;
    }
    .page-title {
      margin: 0;
      font-size: clamp(1.375rem, 1.2rem + 0.8vw, 1.75rem);
      font-weight: 500;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }
    .page-subtitle {
      margin: 4px 0 0;
      font-size: 0.875rem;
      color: var(--gray);
    }

    /* Bento Grid inspirada en image-mockup-ux-ui-home.webp */
    .bento-grid {
      display: grid;
      gap: 16px;
      grid-template-columns: 1fr;
    }
    @media (min-width: 768px) {
      .bento-grid {
        grid-template-columns: repeat(12, minmax(0, 1fr));
      }
    }

    .bento-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 18px;
      min-width: 0;
    }
    .bento-card-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }
    .bento-title {
      margin: 0;
      font-size: 1.0625rem;
      font-weight: 500;
      letter-spacing: -0.01em;
      line-height: 1.3;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .bento-sub {
      margin: 4px 0 0;
      font-size: 0.8125rem;
      color: var(--gray);
      line-height: 1.4;
    }

    .inline-count-coral {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 24px;
      height: 24px;
      padding: 0 7px;
      border-radius: 9999px;
      background: var(--coral);
      color: var(--black);
      font-size: 0.75rem;
      font-weight: 700;
    }

    .metric-pill {
      display: inline-flex;
      align-items: baseline;
      gap: 8px;
      border-radius: 9999px;
      background: var(--elevated);
      border: 1px solid var(--border);
      padding: 10px 18px;
      font-size: 1.5rem;
      font-weight: 500;
      letter-spacing: -0.02em;
    }
    .metric-pill-sm {
      padding: 8px 14px;
      font-size: 1.25rem;
    }
    .metric-currency { color: var(--gray); font-weight: 300; margin-right: 2px; }

    .bento-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    /* Spans responsive */
    .col-span-12 { grid-column: 1 / -1; }
    .bento-subgrid {
      display: grid;
      gap: 16px;
      grid-template-columns: 1fr;
    }
    @media (min-width: 768px) {
      .bento-subgrid {
        grid-template-columns: repeat(12, minmax(0, 1fr));
      }
      .md-6 { grid-column: span 6 / span 6; }
      .md-12 { grid-column: span 12 / span 12; }
    }
    @media (min-width: 1200px) {
      .xl-3 { grid-column: span 3 / span 3; }
      .xl-4 { grid-column: span 4 / span 4; }
      .xl-5 { grid-column: span 5 / span 5; }
      .xl-6 { grid-column: span 6 / span 6; }
      .xl-8 { grid-column: span 8 / span 8; }
      .xl-9 { grid-column: span 9 / span 9; }
    }

    .kpi-stack {
      display: grid;
      gap: 16px;
      grid-template-columns: 1fr;
    }
    @media (min-width: 640px) and (max-width: 1199px) {
      .kpi-stack { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }

    /* Gráfico de barras con rayado diagonal estilo mockup */
    .bars-wrap {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      height: 170px;
      padding-top: 12px;
    }
    .bar-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      height: 100%;
    }
    .bar-track {
      width: 100%;
      max-width: 44px;
      flex: 1;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: repeating-linear-gradient(
        -45deg,
        #18191c,
        #18191c 4px,
        #22242a 4px,
        #22242a 8px
      );
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: flex-end;
    }
    .bar-fill {
      width: 100%;
      border-radius: 12px;
      background: #23252b;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding-top: 8px;
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--gray);
    }
    .bar-fill.active {
      background: var(--lime);
      color: var(--black);
      font-weight: 600;
    }
    .bar-day {
      font-size: 0.75rem;
      color: var(--gray);
    }

    /* Donut CSS puro para Ingresos / Distribución */
    .donut-layout {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    .donut-ring {
      width: 124px;
      height: 124px;
      border-radius: 9999px;
      background: conic-gradient(var(--lime) 0deg 235deg, var(--mint) 235deg 305deg, #232428 305deg 360deg);
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }
    .donut-hole {
      width: 78px;
      height: 78px;
      border-radius: 9999px;
      background: var(--surface);
      display: grid;
      place-items: center;
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--white);
    }
    .legend-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 0.8125rem;
      color: var(--gray);
    }
    .legend-item { display: flex; align-items: center; gap: 8px; }
    .legend-swatch { width: 10px; height: 10px; border-radius: 9999px; flex-shrink: 0; }

    /* Filas internas tipo cápsula (Follow up / Morosos / Turnos) */
    .nested-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .nested-row {
      border-radius: 16px;
      background: var(--elevated);
      border: 1px solid var(--border);
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .nested-row-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }
    .row-icon-dot {
      width: 34px;
      height: 34px;
      border-radius: 9999px;
      background: rgba(193, 244, 41, 0.12);
      border: 1px solid rgba(193, 244, 41, 0.25);
      color: var(--lime);
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }
    .row-icon-dot.coral {
      background: var(--coral-bg);
      border-color: var(--coral-border);
      color: var(--coral);
    }
    .row-title {
      font-size: 0.9375rem;
      font-weight: 500;
      color: var(--white);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .row-meta {
      font-size: 0.8125rem;
      color: var(--gray);
    }
    .chevrons-lime {
      color: var(--lime);
      font-weight: 600;
      letter-spacing: -0.05em;
      font-size: 0.875rem;
      flex-shrink: 0;
    }

    /* Sub-métricas en fila */
    .triple-stats {
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    }
    .mini-stat {
      border-radius: 16px;
      background: var(--elevated);
      border: 1px solid var(--border);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .mini-stat-label {
      font-size: 0.8125rem;
      color: var(--gray);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }
    .mini-stat-val {
      font-size: 1.25rem;
      font-weight: 500;
      color: var(--white);
    }
  </style>
</head>
<body>
  <!-- Barra exclusiva del boceto para simular roles reales de Centris -->
  <div class="preview-toolbar">
    <div class="preview-toolbar-inner">
      <span><strong>Boceto Shell + /inicio</strong> · Referencia visual aplicada a Centris (datos de demostración / seed)</span>
      <div class="preview-pills" role="group" aria-label="Cambiar rol simulado">
        <span>Rol activo:</span>
        <button type="button" class="preview-pill" data-role="admin" aria-pressed="true">Administrador / Recepción</button>
        <button type="button" class="preview-pill" data-role="coach" aria-pressed="false">Coach</button>
        <button type="button" class="preview-pill" data-role="atleta" aria-pressed="false">Atleta</button>
      </div>
    </div>
  </div>

  <div id="sidebar-backdrop" class="sidebar-backdrop hidden"></div>

  <div class="app-shell">
    <!-- Sidebar Vertical Izquierdo (ícono + nombre de sección visible) -->
    <aside id="sidebar" class="sidebar" aria-label="Menú principal del Box">
      <div>
        <div class="brand-lockup">
          <div class="brand-mark">
            <span class="brand-badge-dot">C</span>
            <span>Centris</span>
          </div>
          <button type="button" id="close-drawer" class="mobile-menu-btn hidden" aria-label="Cerrar menú">✕</button>
        </div>

        <nav id="side-nav" class="side-nav"></nav>
      </div>

      <div id="sidebar-footer" class="sidebar-footer"></div>
    </aside>

    <!-- Columna principal -->
    <div class="workspace-col">
      <header class="topbar">
        <div class="topbar-left">
          <button type="button" id="open-drawer" class="mobile-menu-btn" aria-label="Abrir menú de navegación">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>

          <!-- Selector de Box como cápsula -->
          <div class="capsule">
            <span class="capsule-dot" aria-hidden="true"></span>
            <select class="capsule-select" aria-label="Box activo">
              <option>Box Centris Norte</option>
              <option>Box Centris Palermo</option>
            </select>
          </div>

          <!-- Contexto operativo del día -->
          <div class="capsule capsule-muted tabular-nums">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            <span>Hoy · Vie 13/11</span>
            <span>·</span>
            <span style="color:var(--white)">Próxima: WOD 19:00</span>
          </div>
        </div>

        <div class="topbar-right">
          <a href="#alertas" class="icon-btn-circle" aria-label="Avisos pendientes" onclick="return false">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
