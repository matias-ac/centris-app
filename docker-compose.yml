services:
  postgres:
    image: postgres:16-alpine
    container_name: centris-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: centris_owner
      POSTGRES_PASSWORD: centris_owner_pass
      POSTGRES_DB: centris_db
    volumes:
      - centris_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U centris_owner -d centris_db"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  centris_pgdata:
